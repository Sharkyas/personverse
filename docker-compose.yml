# App + Caddy (automatic HTTPS). Used by deploy/vultr-setup.sh.
services:
  app:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-}
    env_file: .env
    restart: unless-stopped
    environment:
      HOST_LABEL: vultr
    # Lets the app reach an Ollama running on the host machine (Docker Desktop / Linux).
    extra_hosts: ["host.docker.internal:host-gateway"]
    # Keeps share links alive across restarts when MongoDB Atlas isn't configured.
    volumes:
      - appdata:/app/.data
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
  # Optional: self-hosted Gemma on the server.  docker compose --profile gemma up -d
  # Needs ~6 GB RAM for gemma3:4b on CPU (Vultr 8 GB plan) or a Vultr GPU.
  ollama:
    image: ollama/ollama
    profiles: ["gemma"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
volumes:
  appdata:
  caddy_data:
  ollama:
